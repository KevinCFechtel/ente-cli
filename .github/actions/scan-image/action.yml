name: Scan final image
description: Scan a Docker archive, enforce the CVE gate, and retain SARIF and SBOM reports

inputs:
  archive:
    description: Path to the final image archive from docker save
    required: true
  arch:
    description: Image architecture (amd64 or arm64)
    required: true
  report-directory:
    description: Report directory relative to the workspace
    required: true

runs:
  using: composite
  steps:
    - name: Scan image and generate reports
      id: scan
      shell: bash
      env:
        ARCHIVE: ${{ inputs.archive }}
        REPORT_DIRECTORY: ${{ inputs.report-directory }}
      run: python3 scripts/scan_image.py "$ARCHIVE" "$REPORT_DIRECTORY"

    - name: Upload image security reports
      if: ${{ always() && steps.scan.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: image-security-${{ inputs.arch }}
        path: ${{ inputs.report-directory }}/
        retention-days: 30
        if-no-files-found: warn

    # Fork and Dependabot PRs still scan and retain reports, without requiring
    # a privileged token or pull_request_target to upload to GitHub Security.
    - name: Upload findings to GitHub Security
      if: >-
        ${{ always() &&
            hashFiles(format('{0}/trivy.sarif', inputs.report-directory)) != '' &&
            (github.event_name != 'pull_request' ||
             (github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]')) }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        sarif_file: ${{ inputs.report-directory }}/trivy.sarif
        category: trivy-image-${{ inputs.arch }}
