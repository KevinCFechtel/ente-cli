name: Published image security

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-image-security
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve published image digest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve latest once for both architectures
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          digest="$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan published image (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published image by immutable digest
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull --platform "linux/$ARCH" "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "ente-cli:published-$ARCH"
          docker save "ente-cli:published-$ARCH" -o "$RUNNER_TEMP/published-image.tar"
          # Literal Markdown backticks, not shell command substitutions.
          # shellcheck disable=SC2016
          printf '## Published image scan (%s)\n\n`%s@%s`\n' \
            "$ARCH" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan published image
        uses: ./.github/actions/scan-image
        with:
          archive: ${{ runner.temp }}/published-image.tar
          arch: ${{ matrix.arch }}
          report-directory: security-reports/${{ matrix.arch }}
