name: Ente CLI container

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Aktuelle Version erneut bauen (z. B. für Basisimage-Updates)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Publishing and moving :latest must never race. PR checks can run independently.
concurrency:
  group: ente-cli-container-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release detection
        run: python3 -m unittest discover -s tests -v
      - name: Find latest stable Rust CLI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.force == true }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 scripts/prepare_release.py "${args[@]}"
      - name: Save release metadata
        if: steps.release.outputs.should_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: .release/
          include-hidden-files: true
          retention-days: 7
      - name: Check summary
        env:
          SHOULD_BUILD: ${{ steps.release.outputs.should_build }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf 'Rust CLI: **%s** · Build erforderlich: **%s**\n' \
            "$VERSION" "$SHOULD_BUILD" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: ente-cli:smoke
          build-args: ENTE_CLI_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=ente-cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ente-cli-${{ matrix.arch }}
      - name: Test CLI as non-root user
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/smoke-test.sh ente-cli:smoke "$VERSION"

  publish:
    needs: [prepare, validate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: .release/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.image }}:latest
          build-args: ENTE_CLI_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
          cache-from: |
            type=gha,scope=ente-cli-amd64
            type=gha,scope=ente-cli-arm64
      # The GitHub release is the success marker. A failed build/push is retried
      # on the next scheduled run because no published release exists yet.
      - name: Publish container release with upstream changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Literal Markdown backticks, not shell command substitutions.
          # shellcheck disable=SC2016
          printf '\n## Image-Digest\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" \
            >> .release/release-notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --latest \
              --title "Ente CLI Container $VERSION" \
              --notes-file .release/release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "Ente CLI Container $VERSION" \
              --notes-file .release/release-notes.md
          fi
          cat .release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
