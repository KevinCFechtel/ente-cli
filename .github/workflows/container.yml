name: Ente CLI container

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the current version (e.g. for base image updates)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Publishing and moving :latest must never race. PR checks can run independently.
concurrency:
  group: ente-cli-container-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release detection
        run: python3 -m unittest discover -s tests -v
      - name: Find latest stable Rust CLI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.force == true }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 scripts/prepare_release.py "${args[@]}"
      - name: Save release metadata
        if: steps.release.outputs.should_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: .release/
          include-hidden-files: true
          retention-days: 7
      - name: Check summary
        env:
          SHOULD_BUILD: ${{ steps.release.outputs.should_build }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf 'Rust CLI: **%s** · Build required: **%s**\n' \
            "$VERSION" "$SHOULD_BUILD" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: ente-cli:smoke-${{ matrix.arch }}
          build-args: ENTE_CLI_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=ente-cli-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ente-cli-${{ matrix.arch }}
      - name: Test CLI as non-root user
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/smoke-test.sh "ente-cli:smoke-$ARCH" "$VERSION"
      - name: Install no-AVX test emulator
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static
      - name: Exercise HTTPS on an emulated CPU without AVX
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/test_no_avx.py ente-cli:smoke-amd64 "$VERSION"
      # Publish precisely the images that passed, not a second source build.
      - name: Save tested image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "ente-cli:smoke-$ARCH" -o "$RUNNER_TEMP/ente-cli-$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/ente-cli-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 2

  publish:
    needs: [prepare, validate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: .release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested-images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            docker load -i "$RUNNER_TEMP/tested-images/ente-cli-$arch.tar"
            docker tag "ente-cli:smoke-$arch" "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The GitHub release is the success marker. A failed build/push is retried
      # on the next scheduled run because no published release exists yet.
      - name: Publish container release with upstream changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Literal Markdown backticks, not shell command substitutions.
          # shellcheck disable=SC2016
          printf '\n## Image digest\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" \
            >> .release/release-notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --latest \
              --title "Ente CLI Container $VERSION" \
              --notes-file .release/release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "Ente CLI Container $VERSION" \
              --notes-file .release/release-notes.md
          fi
          cat .release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
